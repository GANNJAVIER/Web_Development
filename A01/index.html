<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hazard Crew Art Gallery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    body {
      background-image: url("Assets/img/bg.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    .card {
      min-height: 100px;
      background-color: black;
    }
  </style>
</head>

<body>
  <div class="container-fluid p-4">

    <div class="row">
      <div class="col-5 p-1">
        <div class="card p-1 h-100 position-relative">
          <img src="Assets/img/cg_robin.png" class="w-100 h-100 object-fit-cover">
        </div>
      </div>
      <div class="col-7 p-1">
        <div class="card p-1 mb-2">
          <img src="Assets/img/banner.png" style="height: 40vh">
        </div>
        <div class="row">
          <div class="col-3 ">
            <div class="card p-1 mb-2">
              <img src="Assets/img/cg_prologue.png" class="object-fit-cover">
            </div>
            <div class="card p-1">
              <img src="Assets/img/cg_luca.png" class="object-fit-cover" >
            </div>
          </div>
          <div class="col-3 p-0">
            <div class="card p-1 h-100">
              <img src="Assets/img/cg_michael.png" class="w-100 h-100 object-fit-cover">
            </div>
          </div>
          <div class="col-6">
            <div class="card p-1 h-100">
              <img src="Assets/img/spooktober.png" class="w-100 h-100 object-fit-fill " >
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-4 p-1">
        <div class="card p-1 h-100">
          <img src="Assets/img/hazardcrew_luca01.png" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover">
        </div>
      </div>
      <div class="col-2 p-1">
        <div class="card p-1 mb-2">
          <img src="Assets/img/hazardcrew_robin01.png" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover">
        </div>
        <div class="card p-1">
          <img src="Assets/img/hazardcrew_michael01.png" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover">
        </div>
      </div>
      <div class="col-6 p-1">
        <div class="card p-1 h-100">
          <img src="Assets/img/Warehouse_adj.PNG" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover">
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-2 p-1">
        <div class="card p-1">
          <img src="Assets/img/Bloody Cardboard Boxes.png" class="w-100 h-100 object-fit-cover">
        </div>
      </div>
      <div class="col-2 p-1">
        <div class="card p-1">
          <img src="Assets/img/Brick.png" class="w-100 h-100 object-fit-cover">
        </div>
      </div>
      <div class="col-2 p-1">
        <div class="card p-1">
          <img src="Assets/img/Ear.png" class="w-100 h-100 object-fit-cover">
        </div>
      </div>
      <div class="col-2 p-1">
        <div class="card p-1">
          <img src="Assets/img/Glasses.png" class="w-100 h-100 object-fit-cover">
        </div>
      </div>
      <div class="col-2 p-1">
        <div class="card p-1">
          <img src="Assets/img/Hydrogen Peroxide.png" class="w-100 h-100 object-fit-cover">
        </div>
      </div>
      <div class="col-2 p-1">
        <div class="card p-1">
          <img src="Assets/img/Sponge_Bloodsoaked.png" class="w-100 h-100 object-fit-cover">
        </div>
      </div>
    </div>

  </div>
</body>

</html>
